kind = "web"
previewPath = "/"
title = "DailyScore"
description = "A local-first personal productivity PWA for planning daily workout and study tasks, recording partial completion, and understanding progress over time."
version = "1.0.0"
id = "artifacts/dailyscore"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20399

[services.development]
run = "pnpm --filter @workspace/dailyscore run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dailyscore", "run", "build" ]
serve = "static"
publicDir = "artifacts/dailyscore/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20399"
BASE_PATH = "/"
